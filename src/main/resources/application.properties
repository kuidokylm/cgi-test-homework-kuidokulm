spring.profiles.default=dev
logging.level.root=INFO
management.endpoints.web.exposure.include=*

resilience4j.circuitbreaker.instances.notificationDispatch.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.notificationDispatch.sliding-window-size=3
resilience4j.circuitbreaker.instances.notificationDispatch.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.notificationDispatch.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.notificationDispatch.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.notificationDispatch.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.notificationDispatch.record-exceptions=com.example.homework.notification.exception.LegacyNotificationException$DispatchFailed
